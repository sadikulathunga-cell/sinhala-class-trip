name: classtrack
description: ClassTrack - offline/online student tracking for school trips.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0

  # Firebase (online mode)
    firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4

  # Bluetooth LE scanning (teacher side)
  flutter_blue_plus: ^1.32.12
  # BLE advertising (student side). flutter_blue_plus is central-only and
  # cannot advertise, so peripheral mode needs this companion package.
  flutter_ble_peripheral: ^1.2.5

  # GPS + runtime permissions
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Local storage so name/rollNo survive restarts with no internet
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
